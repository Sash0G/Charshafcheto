<!doctype html><html lang="bg"><body style="font-family:Arial,sans-serif;background:#fbf7ef;padding:24px">
<div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #e8dfd2;border-radius:16px;padding:24px">
<h2 style="margin-top:0;color:#0f4f3a">Смяна на парола</h2>
<p>Получихме заявка за смяна на паролата за <b>{{ email }}</b>.</p>
<p><a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" style="background:#c82727;color:#fff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:bold;display:inline-block">Задай нова парола</a></p>
<p style="color:#6d6a64;font-size:13px">Ако не сте заявявали смяна, игнорирайте този имейл.</p></div></body></html>
