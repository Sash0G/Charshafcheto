services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: charshafcheto
      POSTGRES_USER: charshafcheto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charshafcheto"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data

  # Cancels unpaid card orders and releases their stock every 15 minutes.
  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [web]
    command: sh -c "while true; do python manage.py cancel_stale_orders; sleep 900; done"

volumes:
  pgdata:
  media:
  caddy_data:
